site:
  name: Sketch Nomad
  site: 'https://sketchnomad.com'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: G4a_7zqGSvsklpVeSe95HzT1TW4V498Ost4ln_tDUFk

# Default SEO metadata
metadata:
  title:
    default: Sketch Nomad – Urban Sketchers, Plein Air & Outdoor Artists
    template: '%s | Sketch Nomad'
  description: "A community for urban sketchers, plein air painters, outdoor artists, and travel sketchers. Tag sketches to a place, find pleinair spots, and connect worldwide."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Sketch Nomad – Plein Air Sketchers Community
    images:
      - url: '~/assets/images/og-default.png'
        width: 1200
        height: 630
    type: website
  instagram:
    handle: '@sketch.nomad'
    site: '@sketch.nomad'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: G-GTT0NGWRGQ
ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
